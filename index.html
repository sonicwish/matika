<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trenér matematiky</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="dark">

<div class="container">

    <div class="topbar">
        <h1>🧠 Trenér matematiky</h1>

        <button class="theme-btn" onclick="toggleTheme()">
            🌗 Režim
        </button>
    </div>

    <!-- MENU -->
    <div class="panel">

        <select id="operation">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>

        <select id="digitsA"></select>

        <select id="digitsB"></select>

    </div>

    <!-- STATS -->
    <div class="stats">
        <div>🏆 <span id="rank">Bronz</span></div>
        <div>⭐ <span id="score">0</span></div>
        <div>🔥 <span id="streak">0</span></div>
        <div>⚡ x<span id="combo">1</span></div>
    </div>

    <!-- PROGRESS -->
    <div class="progress">
        <div class="bar">
            <div id="fill"></div>
        </div>
    </div>

    <!-- PŘÍKLAD -->
<div class="priklad">

    <div id="simpleView" class="simple"></div>

    <div id="columnView" class="column hidden">
        <div id="numA"></div>
        <div id="numB"></div>
        <div id="line">────────</div>
    </div>

    <!-- ➗ DĚLENÍ -->
    <div id="divView" class="division hidden">

        <div class="div-wrapper">
            <div id="divA" class="div-a"></div>
            <div id="divB" class="div-b"></div>
        </div>

        <div id="divResult" class="div-result"></div>

    </div>

</div>
    <!-- ➗ DĚLENÍ -->
    <div id="divView" class="division hidden">

        <div class="div-wrapper">
            <div id="divA" class="div-a"></div>
            <div id="divB" class="div-b"></div>
        </div>

        <div id="divResult" class="div-result"></div>

    </div>

</div>

    <!-- ODPOVĚĎ -->
    <input
        id="answer"
        autocomplete="off"
        inputmode="numeric"
        placeholder="Výsledek"
    >

    <!-- HLAVNÍ BUTTON -->
    <button id="mainBtn" class="main-btn" onclick="mainAction()">
        START
    </button>

</div>

<!-- GAME OVER -->
<div id="gameOver" class="gameover hidden">

    <h1>💀 KONEC HRY</h1>

    <button onclick="resetGame()">
        Hrát znovu
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
